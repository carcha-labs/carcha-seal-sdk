[package]
name = "licensekit_lease"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Verifies LicenseKit leases (Ed25519-signed JWS) with the same rules as @carchalabs/licensekit-core."
license = "MIT"
publish = false

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
