[package]
name = "licensekit_hwid"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Reads hardware components and returns one keyed hash per component, for LicenseKit machine binding."
license = "MIT"
publish = false

[lib]
# rlib for the Rust tests and tools, staticlib for native apps that link it,
# cdylib for .NET P/Invoke and other loaders.
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"

# Microsoft's raw Win32 bindings, Windows builds only.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
