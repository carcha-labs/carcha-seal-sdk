# Builds and tests the native cores on each OS: hardware ids (packages/hwid), lease
# verification (packages/lease), the license client (packages/client) and their C interface for
# C, C++, C# and Java (packages/native).
name: hwid

on:
  push:
    branches: [main]
    paths: ["packages/hwid/**", "packages/lease/**", "packages/native/**", "packages/client/**", "packages/cpp/**", ".github/workflows/hwid.yml"]
  pull_request:
    paths: ["packages/hwid/**", "packages/lease/**", "packages/native/**", "packages/client/**", "packages/cpp/**", ".github/workflows/hwid.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/hwid

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: rustup component add clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Lease verifier (clippy, unit tests, the core library's vectors)
        working-directory: packages/lease
        run: cargo clippy --all-targets -- -D warnings && cargo test
      - name: C program linked against the static library
        if: runner.os != 'Windows'
        run: tests/c/run.sh
      - name: License client (clippy, every scenario recorded from the Electron SDK)
        working-directory: packages/client
        run: cargo clippy --all-targets -- -D warnings && cargo test
      - name: C interface (clippy; every lease and decrypt vector and client scenario through the C functions; the HTTP client against a local server)
        working-directory: packages/native
        run: cargo clippy --all-targets --features "test-device-secret http" -- -D warnings && cargo clippy --all-targets -- -D warnings && cargo test --features "test-device-secret http"
      - name: C program over every lease vector, linked against the static library
        if: runner.os != 'Windows'
        working-directory: packages/native
        run: tests/c/run.sh
      - name: C++ SDK (CMake builds the native library; every client scenario through seal.hpp)
        working-directory: packages/cpp
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --config Release && ctest --test-dir build -C Release --output-on-failure
      - name: What this runner reads (kinds and hashes only)
        run: cargo run --release --example probe
      - name: Probe for running on a real Windows PC
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: hwid-probe-windows-x64
          path: packages/hwid/target/release/examples/probe.exe
          retention-days: 14
