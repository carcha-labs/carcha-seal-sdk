# The .NET packages (packages/dotnet/pack): the native library built for every platform the packages carry,
# the three packages made from them, and apps that install them on each OS and CPU, .NET Framework included.
name: dotnet-packages

on:
  push:
    branches: [main]
    paths: ["packages/hwid/**", "packages/lease/**", "packages/native/**", "packages/client/**", "packages/dotnet/**", ".github/workflows/dotnet-packages.yml"]
  pull_request:
    paths: ["packages/hwid/**", "packages/lease/**", "packages/native/**", "packages/client/**", "packages/dotnet/**", ".github/workflows/dotnet-packages.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # One shared library per .NET runtime identifier. Windows: the three from one MSVC toolset (i686 is a Rust
  # target without host tools), the C runtime linked in (+crt-static) so the DLL needs no Visual C++
  # redistributable. macOS: both from Apple Silicon, for macOS 11 and later. Linux: built natively on Ubuntu
  # 22.04, so the library asks for no newer glibc than 22.04's (a library linked on a newer system can need a
  # newer one).
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-2025, target: x86_64-pc-windows-msvc, lib: seal_native.dll, cpu: x64, rustflags: "-C target-feature=+crt-static" }
          - { rid: win-x86, os: windows-2025, target: i686-pc-windows-msvc, lib: seal_native.dll, cpu: x86, rustflags: "-C target-feature=+crt-static" }
          - { rid: win-arm64, os: windows-2025, target: aarch64-pc-windows-msvc, lib: seal_native.dll, cpu: ARM64, rustflags: "-C target-feature=+crt-static" }
          - { rid: osx-arm64, os: macos-15, target: aarch64-apple-darwin, lib: libseal_native.dylib, cpu: arm64 }
          - { rid: osx-x64, os: macos-15, target: x86_64-apple-darwin, lib: libseal_native.dylib, cpu: x86_64 }
          - { rid: linux-x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, lib: libseal_native.so, cpu: x86-64 }
          - { rid: linux-arm64, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, lib: libseal_native.so, cpu: aarch64 }
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      RUSTFLAGS: ${{ matrix.rustflags }}
      LIB_PATH: packages/native/target/${{ matrix.target }}/release/${{ matrix.lib }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: rustup target add ${{ matrix.target }}
      - name: Build (no features, as .NET sends requests through HttpClient)
        run: cargo build --release --locked --manifest-path packages/native/Cargo.toml --target ${{ matrix.target }}
      - name: Check the DLL (CPU; only system DLLs, no Visual C++ runtime)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $headers = & $dumpbin /nologo /headers $env:LIB_PATH | Out-String
          if ($headers -notmatch "machine \(${{ matrix.cpu }}\)") { throw "not a ${{ matrix.cpu }} DLL" }
          $dependents = & $dumpbin /nologo /dependents $env:LIB_PATH | Out-String
          Write-Output $dependents
          if ($dependents -match "(?im)^\s*(vcruntime|msvcp|ucrtbase|api-ms-win-crt)") { throw "the DLL needs the Visual C++ runtime" }
      - name: Check the dylib (CPU, macOS 11)
        if: runner.os == 'macOS'
        run: |
          test "$(lipo -archs "$LIB_PATH")" = "${{ matrix.cpu }}"
          vtool -show-build "$LIB_PATH"
          vtool -show-build "$LIB_PATH" | grep -Eq "minos 11\.0$"
      - name: Check the shared library (CPU, newest glibc it needs)
        if: runner.os == 'Linux'
        run: |
          file "$LIB_PATH" | grep -q "${{ matrix.cpu }}"
          needs=$(objdump -T "$LIB_PATH" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -1)
          echo "needs glibc $needs"
          test "$(printf '%s\n' "$needs" 2.35 | sort -V | tail -1)" = 2.35
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: native-${{ matrix.rid }}
          path: ${{ env.LIB_PATH }}
          if-no-files-found: error
          retention-days: 14

  # The three packages, each holding every platform's native library (checked file by file).
  pack:
    needs: native
    runs-on: ubuntu-24.04
    # A job's defaults.run replaces the workflow's, so the shell is set again (Windows would run pwsh).
    defaults:
      run:
        shell: bash
        working-directory: packages/dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: native-*
          path: packages/dotnet/artifacts/download
      - name: Lay out artifacts/native/<rid>/
        run: |
          for d in artifacts/download/native-*; do
            rid=${d#artifacts/download/native-}
            mkdir -p "artifacts/native/$rid"
            mv "$d"/* "artifacts/native/$rid/"
          done
          find artifacts/native -type f | sort
      - run: dotnet pack pack/CarchaLabs.Seal.Runtime && dotnet pack pack/CarchaLabs.Seal.NetFramework && dotnet pack pack/CarchaLabs.Seal
      - name: Check the package contents
        run: |
          python3 - <<'EOF'
          import zipfile
          win = ["win-x86", "win-x64", "win-arm64"]
          expected = {
              "CarchaLabs.Seal": {"lib/net10.0/_._", "lib/netstandard2.0/_._", "lib/net462/_._"},
              "CarchaLabs.Seal.Runtime": {f"{d}/{t}/CarchaLabs.Seal.{x}" for d in ["ref", "runtimes/any/lib"] for t in ["net10.0", "netstandard2.0"] for x in ["dll", "xml"]}
                  | {f"runtimes/{r}/native/seal_native.dll" for r in win}
                  | {f"runtimes/{r}/native/libseal_native.dylib" for r in ["osx-x64", "osx-arm64"]}
                  | {f"runtimes/{r}/native/libseal_native.so" for r in ["linux-x64", "linux-arm64"]},
              "CarchaLabs.Seal.NetFramework": {"lib/net462/CarchaLabs.Seal.dll", "lib/net462/CarchaLabs.Seal.xml",
                  "build/net462/CarchaLabs.Seal.NetFramework.targets", "buildTransitive/net462/CarchaLabs.Seal.NetFramework.targets"}
                  | {f"native/{r}/seal_native.dll" for r in win},
          }
          failed = False
          for package, files in expected.items():
              names = zipfile.ZipFile(f"artifacts/packages/{package}.0.1.0.nupkg").namelist()
              content = {n for n in names if not n.startswith(("_rels/", "package/", "[Content_Types]")) and n not in (f"{package}.nuspec", "README.md")}
              for n in sorted(files - content): print(f"{package}: missing {n}"); failed = True
              for n in sorted(content - files): print(f"{package}: unexpected {n}"); failed = True
              print(f"{package}: {len(content)} files")
          raise SystemExit(1 if failed else 0)
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: nuget-packages
          path: packages/dotnet/artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 14

  # A .NET 10 app installing CarchaLabs.Seal on each OS and CPU: NuGet picks runtimes/<rid>/native and the runtime
  # loads it. Ubuntu 22.04 is the oldest glibc the library is built for.
  consumer-dotnet:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm, macos-15, macos-15-intel, ubuntu-22.04, ubuntu-22.04-arm, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    # A job's defaults.run replaces the workflow's, so the shell is set again (Windows would run pwsh).
    defaults:
      run:
        shell: bash
        working-directory: packages/dotnet/tests/Consumer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: nuget-packages
          path: packages/dotnet/artifacts/packages
      - name: Install from the packages, run
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' ../../../native/Cargo.toml | head -1)
          dotnet build -c Release -o out/net10
          dotnet out/net10/Consumer.dll "$version"

  # .NET Framework apps: PackageReference (SDK-style) for each CPU setting, and packages.config with Visual Studio's
  # MSBuild. Each must load the carcha-seal\<cpu>\ copy for its process. On Windows ARM64, x86 and x64 run emulated
  # and ARM64 natively (.NET Framework 4.8.1); an AnyCPU app is checked to load one of the copies.
  consumer-framework:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    # A job's defaults.run replaces the workflow's, so the shell is set again (Windows would run pwsh).
    defaults:
      run:
        shell: bash
        working-directory: packages/dotnet/tests/Consumer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: nuget-packages
          path: packages/dotnet/artifacts/packages
      - run: echo "SEAL_NATIVE_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' ../../../native/Cargo.toml | head -1)" >> "$GITHUB_ENV"
      - name: PackageReference, each CPU setting
        run: |
          app() {
            name=$1; tfm=$2; cpu=$3; shift 3
            echo "::group::$name ($tfm $*)"
            dotnet build -c Release --no-incremental -p:SealTfm="$tfm" "$@" -o "out/$name"
            "out/$name/Consumer.exe" "$SEAL_NATIVE_VERSION" ${cpu:+"$cpu"}
            echo "::endgroup::"
          }
          app x86 net48 x86 -p:PlatformTarget=x86
          app x64 net48 x64 -p:PlatformTarget=x64
          app anycpu-32 net48 x86 -p:PlatformTarget=AnyCPU -p:Prefer32Bit=true
          if [ "${{ matrix.os }}" = windows-11-arm ]; then
            app arm64 net481 arm64 -p:PlatformTarget=ARM64
            app anycpu net48 "" -p:PlatformTarget=AnyCPU -p:Prefer32Bit=false
          else
            app anycpu net48 x64 -p:PlatformTarget=AnyCPU -p:Prefer32Bit=false
          fi
      - name: packages.config (nuget restore, Visual Studio's MSBuild)
        if: matrix.os == 'windows-2025'
        working-directory: packages/dotnet/tests/Consumer/Legacy
        shell: pwsh
        run: |
          nuget restore packages.config -PackagesDirectory ..\packages -ConfigFile ..\nuget.config -NonInteractive
          if ($LASTEXITCODE) { exit 1 }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          foreach ($platform in @(@('x86', 'x86'), @('x64', 'x64'), @('AnyCPU', 'x64'))) {
            & $msbuild Legacy.csproj -nologo -v:m -p:Configuration=Release -p:Platform=$($platform[0])
            if ($LASTEXITCODE) { exit 1 }
            & "bin\$($platform[0])\Legacy.exe" $env:SEAL_NATIVE_VERSION $platform[1]
            if ($LASTEXITCODE) { exit 1 }
          }
